<style>

<style>
/* Layout: one mobile column, sticky date header, bottom tab bar, every form opens as a bottom sheet. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#16231F; --muted:#5D6B66; --line:#DDE3E0;
  --accent:#0E6F66; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB;
  --ok:#2E7D4F; --ok-soft:#E0F1E6; --warn:#8A5A00; --warn-soft:#FBEBC9; --bad:#B3261E; --bad-soft:#FADCD9;
  --shadow:0 8px 28px rgba(22,35,31,.18); --bar-mute:#C3CEC9;
  --font:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1715; --surface:#16211E; --ink:#E6EEEB; --muted:#9AA9A3; --line:#28362F;
    --accent:#4FC3B5; --accent-ink:#06201C; --accent-soft:#17332F;
    --ok:#6CCB8F; --ok-soft:#173324; --warn:#E8B04A; --warn-soft:#3A2C10; --bad:#F08A82; --bad-soft:#3F1B18;
    --shadow:0 8px 28px rgba(0,0,0,.5); --bar-mute:#34443E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#16211E; --ink:#E6EEEB; --muted:#9AA9A3; --line:#28362F;
  --accent:#4FC3B5; --accent-ink:#06201C; --accent-soft:#17332F;
  --ok:#6CCB8F; --ok-soft:#173324; --warn:#E8B04A; --warn-soft:#3A2C10; --bad:#F08A82; --bad-soft:#3F1B18;
  --shadow:0 8px 28px rgba(0,0,0,.5); --bar-mute:#34443E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 100px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:flex-start;gap:12px;padding-block:14px 10px}
header.top .sync{margin-inline-start:auto}
.wd{font-size:13px;color:var(--muted)}
.dt{font-size:22px;font-weight:700;line-height:1.3}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2{font-size:16px;font-weight:700;margin:0}
h3{font-size:15px;font-weight:600;margin:0;line-height:1.5}
.sub{font-size:12.5px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px}
.strip div{padding:12px 8px;text-align:center}
.strip div+div{border-inline-start:1px solid var(--line)}
.strip b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.strip span{font-size:12px;color:var(--muted)}
.strip .bad b{color:var(--bad)} .strip .warn b{color:var(--warn)} .strip .ok b{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.grow{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px}
.tag i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dates{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12.5px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;min-height:40px}
.btn.sm{padding:5px 12px;min-height:34px;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.block{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:13.5px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:18px 10px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px}
textarea{resize:vertical;min-height:84px}
.check{display:flex;gap:10px;align-items:center;min-width:0}
.check input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.item{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item+.item{margin-top:-4px}
.item .name{flex:1;min-width:0;background:none;border:0;text-align:start;padding:0;min-height:0;overflow-wrap:anywhere}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.item .qty{font-size:12.5px;color:var(--muted);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px}
.subs{display:flex;flex-direction:column;gap:2px;padding-inline-start:32px}
.totals{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.totals b{color:var(--ink)}
.tl-month{font-size:13px;font-weight:700;color:var(--muted);padding-top:6px}
.log{display:flex;flex-direction:column;gap:4px;text-align:start;width:100%}
.strip.two{grid-template-columns:repeat(2,1fr)}
.strip.two b{font-size:20px;overflow-wrap:anywhere}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.chip.sm{padding:2px 12px;min-height:30px;font-size:13px}
.dprev{font-weight:500;color:var(--ink)}
.okx{color:var(--ok);font-weight:600}
.chart.noaxis .cols,.chart.noaxis .xl{padding-inline-start:0}
.chart.noaxis .gl{inset-inline:0}
.icon-btn.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn.x{width:36px;height:36px;border-radius:50%}
.icon-btn.x svg{width:18px;height:18px}
.linkish{background:none;border:0;padding:0;text-align:start;font:inherit;font-weight:600;color:inherit;min-width:0;overflow-wrap:anywhere}
.acts .more{margin-inline-start:auto;padding-inline:10px}
.acts .more svg{width:20px;height:20px;fill:currentColor;stroke:none;display:block}
.grp{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px}
.grp.over{color:var(--bad)} .grp.today{color:var(--warn)}
.mini{display:flex;align-items:center;gap:6px}
.mini select{width:auto;min-height:34px;padding:2px 10px;border-radius:10px}
.banner .acts{flex-wrap:nowrap;align-items:center;flex:none}
.chips.fade-e{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px);mask-image:linear-gradient(to right,transparent 0,#000 28px)}
.chips.fade-s{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 28px);mask-image:linear-gradient(to left,transparent 0,#000 28px)}
.chips.fade-s.fade-e{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;font-size:11.5px;color:var(--muted);min-height:58px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,20,17,.5)}
.panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.panel:focus{outline:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:44px;margin-inline:-16px;padding-inline:16px;touch-action:none;cursor:grab}
.sheet-top .x{position:absolute;inset-inline-end:12px;top:4px;cursor:pointer}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line)}
.form{display:flex;flex-direction:column;gap:12px}
.form h2{font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld>span{font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.datef{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)} .sync.warn i{background:var(--warn)} .sync.bad i{background:var(--bad)}
.hero{font-size:48px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.hero small{font-size:15px;font-weight:500;color:var(--muted);margin-inline-start:8px}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.delta.up{color:var(--warn)} .delta.down{color:var(--ok)} .delta.flat{color:var(--muted)}
.mon-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mon-nav .name{font-weight:700;font-size:17px}
.chart{position:relative;overflow-x:clip;padding-top:22px}
.plot{position:relative;height:150px}
.gl{position:absolute;inset-inline:44px 0;border-top:1px solid var(--line)}
.tk{position:absolute;inset-inline-start:0;width:40px;font-size:11px;line-height:1;color:var(--muted);transform:translateY(50%)}
.cols{position:absolute;inset:0;display:flex;gap:8px;padding-inline-start:44px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:none;border:0;padding:0;position:relative}
.col .bar{display:block;width:min(24px,60%);background:var(--bar-mute);border-radius:4px 4px 0 0}
.col.sel .bar{background:var(--accent)}
.col:hover .bar{filter:brightness(.9)}
.col .val{font-size:11.5px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.col::after{content:attr(data-tip);display:none;position:absolute;top:-28px;inset-inline-start:50%;transform:translateX(50%);z-index:3;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap}
.col:first-child::after{inset-inline-start:0;transform:none}
.col:last-child::after{inset-inline-start:auto;inset-inline-end:0;transform:none}
.col:hover::after,.col:focus-visible::after{display:block}
.xl{display:flex;gap:8px;padding-inline-start:44px;margin-top:6px}
.xl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap}
.xl span.sel{color:var(--ink);font-weight:700}
.brow{display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--accent-soft);border-radius:4px}
.fill{height:100%;background:var(--accent);border-radius:4px 0 0 4px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line)}
.wdgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wdc{position:relative;display:block}
.wdc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.wdc span{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;color:var(--ink)}
.wdc input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wdc input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);border:0;margin:4px 0;width:100%}
.big-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btns .btn{min-height:64px;font-weight:600}
.edrow{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:6px;align-items:center}
.edrow input[type=color]{width:40px;height:40px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.edrow .btn{padding:4px 10px;min-height:38px}
.toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:14px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 8px}
:root[data-theme="light"] .toast button{color:#7FE0D3}
@media (prefers-color-scheme: light){.toast button{color:#7FE0D3}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="app" dir="rtl" lang="fa">
  <header class="top">
    <div><div class="wd" id="hd-wd"></div><div class="dt" id="hd-dt"></div></div>

</div>

function monthBounds(off){
  var j=S.settings.cal==='j',t=ymd(todayISO()),idx=t.y*12+(t.m-1)+off,y=div(idx,12),m=mod(idx,12)+1,s,e,nm=(j?JM:GM)[m-1];
  if(j){s=fromJ(y,m,1);e=fromJ(y,m,jMonthLen(y,m))}else{s=isoOf(y,m,1);e=isoOf(y,m,gMonthLen(y,m))}
  return {s:s,e:e,label:nm+' '+fa(y),short:nm};
}
function spendItems(s,e){
  var a=S.expenses.filter(function(x){return x.date>=s&&x.date<=e}).map(function(x){return {kind:'exp',id:x.id,date:x.date,title:x.title,amount:x.amount||0,cat:x.cat,bill:!!x.billId,list:!!x.listId}});
  var b=S.logs.filter(function(l){return l.cost>0&&l.date>=s&&l.date<=e}).map(function(l){return {kind:'log',id:l.id,date:l.date,title:l.title,amount:l.cost,cat:l.cat}});
  return a.concat(b).sort(function(x,y){return y.date.localeCompare(x.date)});

function billTrend(b){
  var h=b.history.slice(0,6).reverse();
  if(h.length<2)return '';
  var vals=h.map(function(x){return x.amount||0}),mx=Math.max.apply(null,vals);
  if(!mx)return '';
  var H=90,hi=vals.indexOf(mx),last=h[h.length-1],prev=h[h.length-2];
  var avg=sumOf(h)/h.length,pct=prev.amount?Math.round((last.amount-prev.amount)/prev.amount*100):0;
  var mn=S.settings.cal==='j'?JM:GM;
  var out='<hr class="hr"><div class="form"><h2>روند مبلغ پرداخت‌ها</h2><div class="sub">هزار تومان. هر ستون یک پرداخت است.</div>'
    +'<div class="chart noaxis"><div class="plot" style="height:'+H+'px"><div class="gl" style="bottom:0"></div><div class="cols">'
    +h.map(function(x,i){
      var ht=Math.max(3,Math.round((x.amount||0)/mx*H)),tip=fmtDate(x.date,{year:true})+' · '+money(x.amount);
      return '<span class="col'+(i===h.length-1?' sel':'')+'" tabindex="0" data-tip="'+esc(tip)+'" aria-label="'+esc(tip)+'">'+((i===hi||i===h.length-1)&&x.amount?'<span class="val">'+fa(Math.round(x.amount/1000))+'</span>':'')+'<span class="bar" style="height:'+ht+'px"></span></span>';
    }).join('')
    +'</div></div><div class="xl">'+h.map(function(x,i){return '<span'+(i===h.length-1?' class="sel"':'')+'>'+esc(mn[ymd(x.date).m-1])+'</span>'}).join('')+'</div></div>'
    +'<div class="totals"><span>میانگین '+fa(h.length)+' پرداخت اخیر: <b>'+money(avg)+'</b></span>'
    +(prev.amount?'<span class="delta '+(pct>0?'up':pct<0?'down':'flat')+'"><span aria-hidden="true">'+(pct>0?'▲':pct<0?'▼':'■')+'</span>'+(pct===0?'برابر با پرداخت قبلی':fa(Math.abs(pct))+'٪ '+(pct>0?'بیشتر':'کمتر')+' از پرداخت قبلی')+'</span>':'')+'</div></div>';
  return out;
}

  ACT[k+'-up']=function(el){mv(S[key],el.dataset.id,-1);save();settingsSheet(true);render()};
  ACT[k+'-down']=function(el){mv(S[key],el.dataset.id,1);save();settingsSheet(true);render()};
  ACT[k+'-del']=function(el){var id=el.dataset.id;snap();S[key]=S[key].filter(function(x){return x.id!==id});S.tasks.concat(S.todos,S.logs).forEach(function(x){if(x[ref]===id)x[ref]=null});S.shops.forEach(function(l){l.items.forEach(function(i){if(i.cat===id&&k==='cat')i.cat=null})});save();settingsSheet(true);render();toast('حذف شد',true)};
});

var FORM={
  task:function(fd,f){
    var title=(fd.get('title')||'').trim();if(!title)return;snap();
    var unit=fd.get('unit'),n=Math.max(1,Math.round(num(fd,'n',1))),days=unit==='week'?fd.getAll('wd').map(Number):[];
    var o={title:title,room:fd.get('room')||null,cat:fd.get('cat')||null,every:{n:n,unit:unit},mode:days.length?'fixed':fd.get('mode'),days:days,prio:+fd.get('prio'),mins:Math.max(0,Math.round(num(fd,'mins',0))),due:readDate(fd,'due')||todayISO()};
    if(days.length&&days.indexOf(wdIdx(o.due))<0)o.due=nextWeekday(addDays(o.due,-1),days,n,o.due);
    o.anchor=ymd(o.due).d;o.anchorCal=S.settings.cal;
    var t=f.dataset.id&&byId(S.tasks,f.dataset.id);
    if(t){if(t.due!==o.due){t.origDue=null;t.snoozes=0}Object.assign(t,o)}else S.tasks.push(Object.assign({id:uid(),history:[],last:null,archived:false},o));
    if(f.dataset.from){var td=byId(S.todos,f.dataset.from);if(td){td.done=true;td.doneOn=todayISO()}}
    closeSheet();commit();toast('ذخیره شد',true);
  },
  past:function(fd,f){var t=byId(S.tasks,f.dataset.id),d=readDate(fd,'on');if(!d)return;if(doneOn(t,d)){toast('در این تاریخ قبلاً ثبت شده');return}snap();doComplete(t,d);closeSheet();commit();toast('انجام در '+fmtDate(d,{year:true})+' ثبت شد',true)},
  snooze:function(fd,f){var t=byId(S.tasks,f.dataset.id),to=readDate(fd,'on');if(!to)return;snap();doSnooze(t,to);closeSheet();commit();toast('موعد به '+fmtDate(t.due)+' رفت',true)},
  additem:function(fd,f){var n=(fd.get('name')||'').trim();if(!n)return;var L=curList();snap();L.items.push({id:uid(),name:n,qty:1,unit:'عدد',price:0,cat:'shop',note:'',done:false});commit();var i=document.querySelector('[name=name]');if(i)i.focus()},
  addtodo:function(fd){var n=(fd.get('title')||'').trim();if(!n)return;snap();S.todos.push({id:uid(),title:n,room:null,due:null,prio:2,done:false,subs:[]});commit();var i=document.querySelector('[name=title]');if(i)i.focus()},
  todo:function(fd,f){
    var title=(fd.get('title')||'').trim();if(!title)return;snap();
    var x=f.dataset.id&&byId(S.todos,f.dataset.id),old=x?x.subs:[];
    var subs=(fd.get('subs')||'').split('\n').map(function(s){return s.trim()}).filter(Boolean).map(function(s){var m=old.find(function(o){return o.t===s});return {t:s,done:m?m.done:false}});
    var o={title:title,room:fd.get('room')||null,prio:+fd.get('prio'),due:readDate(fd,'due'),subs:subs};
    if(x)Object.assign(x,o);else S.todos.push(Object.assign({id:uid(),done:false},o));
    closeSheet();commit();toast('ذخیره شد',true);
  },
  item:function(fd,f){var L=curList(),i=byId(L.items,f.dataset.id);snap();Object.assign(i,{name:(fd.get('name')||'').trim()||i.name,qty:num(fd,'qty',1)||1,unit:fd.get('unit'),price:Math.max(0,num(fd,'price',0)),cat:fd.get('cat')||null,note:fd.get('note')||''});closeSheet();commit()},
  list:function(fd,f){var n=(fd.get('name')||'').trim();if(!n)return;snap();if(f.dataset.id)byId(S.shops,f.dataset.id).name=n;else{var l={id:uid(),name:n,items:[]};S.shops.push(l);ui.shop=l.id}closeSheet();commit()},
  log:function(fd,f){
    var title=(fd.get('title')||'').trim();if(!title)return;snap();
    var o={title:title,date:readDate(fd,'date')||todayISO(),cat:fd.get('cat')||null,cost:Math.max(0,num(fd,'cost',0)),note:fd.get('note')||''};
    var x=f.dataset.id&&byId(S.logs,f.dataset.id);if(x)Object.assign(x,o);else S.logs.push(Object.assign({id:uid()},o));
    closeSheet();commit();toast('ذخیره شد',true);
  },
  bill:function(fd,f){
    var title=(fd.get('title')||'').trim();if(!title)return;snap();
    var due=readDate(fd,'due')||todayISO();
    var o={title:title,amount:Math.max(0,num(fd,'amount',0)),cat:fd.get('cat')||null,every:{n:Math.max(1,Math.round(num(fd,'n',1))),unit:fd.get('unit')},due:due,anchor:ymd(due).d,anchorCal:S.settings.cal,remind:Math.max(0,+fd.get('remind')||0)};
    var b=f.dataset.id&&byId(S.bills,f.dataset.id);
    if(b)Object.assign(b,o);else S.bills.push(Object.assign({id:uid(),history:[]},o));
    closeSheet();commit();toast('ذخیره شد',true);
  },
  'pay-bill':function(fd,f){
    var b=byId(S.bills,f.dataset.id),amt=Math.max(0,num(fd,'amount',b.amount)),d=readDate(fd,'on')||todayISO();
    if(b.history.some(function(h){return h.date===d})){toast('در این تاریخ قبلاً پرداخت ثبت شده');return}
    snap();
    b.history.unshift({date:d,amount:amt});b.history.sort(function(x,y){return y.date.localeCompare(x.date)});
    if(amt)b.amount=amt;
    b.due=addInterval(b.due,b.every.n,b.every.unit,S.settings.cal,anchorOf(b));
    S.expenses.push({id:uid(),date:d,title:b.title,amount:amt,cat:b.cat,billId:b.id,note:''});
    closeSheet();commit();toast('پرداخت ثبت شد. موعد بعدی: '+fmtDate(b.due),true);
  },
  finish:function(fd){
    var L=curList(),amt=num(fd,'amount',0),got=L.items.filter(function(i){return i.done});
    if(!(amt>0)){toast('مبلغ فاکتور را بنویس');return}
    snap();
    S.expenses.push({id:uid(),date:readDate(fd,'date')||todayISO(),title:(fd.get('title')||'').trim()||('خرید '+L.name),amount:Math.round(amt),cat:fd.get('cat')||null,note:'اقلام: '+got.map(function(i){return i.name}).join('، '),listId:L.id});
    if(fd.get('clear'))L.items=L.items.filter(function(i){return !i.done});
    closeSheet();commit();toast('هزینه ثبت شد: '+money(amt),true);
  },
  exp:function(fd,f){
    var title=(fd.get('title')||'').trim();if(!title)return;snap();
    var o={title:title,amount:Math.max(0,num(fd,'amount',0)),cat:fd.get('cat')||null,date:readDate(fd,'date')||todayISO(),note:fd.get('note')||''};
    var x=f.dataset.id&&byId(S.expenses,f.dataset.id);
    if(x)Object.assign(x,o);else S.expenses.push(Object.assign({id:uid()},o));
    closeSheet();commit();toast('ذخیره شد',true);
  },
  quickexp:function(fd){
    var t=(fd.get('title')||'').trim(),a=num(fd,'amount',0);
    if(!t||!a){toast('عنوان و مبلغ را بنویس');return}
    snap();S.expenses.push({id:uid(),date:todayISO(),title:t,amount:a,cat:byId(S.cats,'other')?'other':null,note:''});ui.moff=0;commit();toast('هزینه ثبت شد',true);
  },
  'import':function(fd){
    try{var o=JSON.parse(fd.get('json'));if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.shops))throw 0;o.bills=o.bills||[];o.expenses=o.expenses||[];snap();S=o;ui.shop=null;closeSheet();commit();toast('بازیابی شد',true)}
    catch(e){toast('متن پشتیبان معتبر نیست')}
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='A')e.preventDefault();
  fn(el,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;
  e.preventDefault();var fn=FORM[f.dataset.form];if(fn)fn(new FormData(f),f);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.name&&t.form&&/_(d|m|y)$/.test(t.name))syncDate(t.form,t.name.replace(/_(d|m|y)$/,''));
  var el=e.target.closest('[data-chg]');if(!el)return;var k=el.dataset.chg,id=el.dataset.id;
  if(k==='buy'){var L=curList(),i=byId(L.items,id);snap();i.done=el.checked;if(el.checked){S.freq=S.freq||{};S.freq[i.name]=(S.freq[i.name]||0)+1}commit()}
  else if(k==='todo'){var x=byId(S.todos,id);snap();x.done=el.checked;x.doneOn=el.checked?todayISO():null;commit();if(el.checked)toast('«'+x.title+'» انجام شد',true)}
  else if(k==='sub'){var td=byId(S.todos,id);td.subs[+el.dataset.i].done=el.checked;commit()}
  else if(k==='unit'){var wr=$('#wdrow');if(wr)wr.hidden=el.value!=='week'}
  else if(k==='budget'){ui.budget=+el.value;render()}
  else if(k==='room-name'||k==='cat-name'){var a=byId(k==='room-name'?S.rooms:S.cats,id);a.name=el.value.trim()||a.name;save();render()}
  else if(k==='room-color'||k==='cat-color'){byId(k==='room-color'?S.rooms:S.cats,id).color=el.value;save();render()}
});
document.addEventListener('input',function(e){
  var el=e.target;if(el.dataset&&el.dataset.num){liveFormat(el);return}
  if(el.dataset&&el.dataset.chg==='logq'){ui.q=el.value;var pos=el.selectionStart;render();var n=$('#logq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

document.addEventListener('scroll',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('chips'))chipFade(t)},true);
(function(){
  var top=$('.sheet-top'),panel=$('.panel'),y0=null,dy=0;
  top.addEventListener('pointerdown',function(e){if(e.target.closest('.x'))return;y0=e.clientY;dy=0;try{top.setPointerCapture(e.pointerId)}catch(x){}});
  top.addEventListener('pointermove',function(e){if(y0==null)return;dy=Math.max(0,e.clientY-y0);panel.style.transition='none';panel.style.transform='translateY('+dy+'px)'});
  function end(){if(y0==null)return;var d=dy;y0=null;dy=0;panel.style.transition='';panel.style.transform='';if(d>90)closeSheet()}
  top.addEventListener('pointerup',end);top.addEventListener('pointercancel',end);
})();

render();
updateSyncUI();
initSync();
})();
</script>
